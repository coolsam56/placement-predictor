services:
  - type: web
    name: placement-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: SECRET_KEY
        generateValue: true
